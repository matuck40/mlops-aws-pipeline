name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Instalar dependências (versões exatas do uv.lock)
        run: uv sync --locked
      - name: Rodar testes
        run: uv run pytest -v
